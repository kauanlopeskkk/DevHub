<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Cadastro - DevHub</title>

<link rel="stylesheet" href="css/fundo.css">
```
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>

```
<main>

    
    <section class="cadastro-container">

        <h1>🚀 DevHub</h1>

        <h2>Crie sua conta</h2>

        <p>
            Cadastre-se para organizar seus projetos e tarefas.
        </p>


        <form id="cadastro-form">

            <label for="nome">
                Nome
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                required
            >


            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >


            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Crie uma senha"
                required
            >


            <label for="confirmar-senha">
                Confirmar senha
            </label>

            <input
                type="password"
                id="confirmar-senha"
                placeholder="Digite sua senha novamente"
                required
            >


            <button type="submit">
                Criar conta
            </button>

        </form>


        <p>
            Já possui uma conta?

            <a href="login.html">
                Fazer login
            </a>
        </p>

    </section>

</main>

</body>

</html>
<script src="js/cadastro.js"></script>
