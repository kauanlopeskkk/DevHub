<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard-DevHub</title>
</head>
<body>
    <header>
        <h1>DevHub</h1>

            <nav>

                <a href="dashboard.html">Dashboard</a>

                <a href="#">Projetos</a>
                <a href="#">Tarefas</a>
                <a href="#">Bugs</a>
                <button id="layout">Sair</button>
            </nav>
            </header>

            <main>

        <section class="boas-vindas">

            <h2>Bem-vindo ao DevHub 👋</h2>
                <p>Organize seus projetos,tarefas e bugs em um só lugar.</p>

        </section>

        <section class="Estatica">

            <div class="card">

                <h3>💻 Projetos</h3>
                <p id="total--projetos">0</p>

            </div>

            <div class="card">

                <h3>

                    📝 Tarefas

                </h3>

                <p id="total-tarefas">0</p>
            </div>

            <div class="card">

                    <h3>🐛 Bugs</h3>
                        <p id="total-bugs">0</p>
            </div>

        </section>

        <section class="projetos">

        <div class="titulo-secao">

        <h3>Meus Projetos</h3>

        <button id="novo-projeto">+Novo Projeto</button>

        </div>

        <div class="listar-projetos">

        <p>
            Nenhum projeto encontrado.
        </p>

        </div>

        </section>

        <section class="tarefas">

        <div class="titulo-secao">

            <h2>Minhas Tarefas</h2>

        <button id="nova-tarefa">+ Nova Tarefa</button>
        </div>


        <div class="listar-tarefa">

        <p>Nenhuma tarefa encontrado</p>

        </div>
        </section>

        <section class="Bugs">
        <div class="titulo-secao">

        <h2>Bugs Recentes</h2>

        <button id="novo-bugs">+ Registrar Bug</button>

        </div>

        <div class="lista-bugs">

        <p>Nenhum bug encontrado</p>

        </div>
        </section>
</main>



</body>
</html>
